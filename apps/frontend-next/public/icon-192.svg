<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky gradient: day to night transition -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d7eae;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6fb1e7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d1f2c;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ecca2f;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ecca2f;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Rounded rectangle background (36px radius = ~18.75% for 192px) -->
  <rect width="192" height="192" rx="36" ry="36" fill="url(#skyGradient)"/>
  
  <!-- Inner border shadow effect -->
  <rect width="192" height="192" rx="36" ry="36" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Stars (night reference) - subtle, in upper area -->
  <circle cx="152" cy="24" r="2" fill="white" opacity="0.8"/>
  <circle cx="176" cy="48" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="144" cy="72" r="2" fill="white" opacity="0.8"/>
  <circle cx="164" cy="56" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="156" cy="88" r="1.5" fill="white" opacity="0.7"/>
  
  <!-- Sun glow effect -->
  <circle cx="96" cy="96" r="48" fill="url(#sunGlow)"/>
  
  <!-- Sun (center-left, slightly offset) -->
  <circle cx="96" cy="96" r="32" fill="#ecca2f">
    <!-- Inner highlight -->
    <animate attributeName="fill-opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="96" r="28" fill="#f9d71c" opacity="0.4"/>
  
  <!-- Clouds (day reference) - bottom area -->
  <!-- Cloud 1 -->
  <g transform="translate(20, 164)">
    <ellipse cx="24" cy="10" rx="24" ry="10" fill="#f3fdff" opacity="0.85"/>
    <circle cx="10" cy="10" r="10" fill="#f3fdff" opacity="0.85"/>
    <circle cx="26" cy="6" r="10" fill="#f3fdff" opacity="0.85"/>
    <circle cx="38" cy="10" r="13" fill="#f3fdff" opacity="0.85"/>
  </g>
  
  <!-- Cloud 2 (smaller) -->
  <g transform="translate(100, 156)">
    <ellipse cx="18" cy="8" rx="18" ry="8" fill="#f3fdff" opacity="0.7"/>
    <circle cx="8" cy="8" r="8" fill="#f3fdff" opacity="0.7"/>
    <circle cx="20" cy="5" r="8" fill="#f3fdff" opacity="0.7"/>
    <circle cx="30" cy="8" r="10" fill="#f3fdff" opacity="0.7"/>
  </g>
</svg>
