# Full stack: app + Nginx + Prometheus/Grafana/Alertmanager + n8n/LiteLLM (all services, no profiles).
#
# From repo root:
#   docker compose -f docker-compose.full.yml --env-file .env up -d --build
#
# Or:
#   docker compose --env-file .env -f infra/docker/docker-compose.full.yml up -d --build
#
# If Windows blocks host port 5432, set DB_PORT=5433 in .env. If 3000 is busy, set FRONTEND_PORT to a free host port.

include:
  - path: docker-compose.base.yml
  - path: docker-compose.security.yml
  - path: docker-compose.monitoring.yml
  - path: docker-compose.automation.yml
  - path: docker-compose.jenkins.yml
