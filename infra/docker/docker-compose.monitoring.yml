services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: tod-node-exporter
    command:
      - --path.rootfs=/host
    # pid: host + rslave breaks Docker Desktop (Windows/macOS). Use :ro only; on Linux VMs you can add pid:host and ,rslave via override.
    restart: unless-stopped
    volumes:
      - /:/host:ro
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    profiles: ["monitoring"]
    networks:
      - tod-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: tod-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      # Host 8080 is often taken on Windows; map host → 8089 by default (container still listens on 8080).
      - "${CADVISOR_PORT:-8089}:8080"
    profiles: ["monitoring"]
    networks:
      - tod-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tod-prometheus
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    profiles: ["monitoring"]
    networks:
      - tod-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tod-alertmanager
    restart: unless-stopped
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    profiles: ["monitoring"]
    networks:
      - tod-network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: tod-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3010}:3000"
    profiles: ["monitoring"]
    networks:
      - tod-network

volumes:
  prometheus_data:
  grafana_data:
