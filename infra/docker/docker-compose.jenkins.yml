services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: tod-jenkins
    container_name: tod-jenkins
    restart: unless-stopped
    user: root
    environment:
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:MaxRAMPercentage=60"
    ports:
      - "${JENKINS_PORT:-8090}:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tod-network

volumes:
  jenkins_data:
