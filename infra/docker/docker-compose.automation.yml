services:
  n8n:
    image: n8nio/n8n:1.82.3
    container_name: tod-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-32-chars-minimum}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-Asia/Almaty}
      TZ: ${N8N_TIMEZONE:-Asia/Almaty}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:3001}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows
    profiles: ["automation"]
    networks:
      - tod-network

volumes:
  n8n_data:

networks:
  tod-network:
    external: false
