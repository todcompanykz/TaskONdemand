---
- name: Configure TaskOnDemand VM
  hosts: tod_vm
  become: true
  vars:
    allowed_tcp_ports:
      - 22
      - 80
      - 443
      - 3000
      - 3001
      - 5432
      - 6379
      - 5672
      - 15672
  tasks:
    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - ufw
          - fail2ban
        state: present
        update_cache: true

    - name: Allow required ports in UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ allowed_tcp_ports }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
